<!-- backend/public/admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cheerful Chick - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .admin-container {
            display: flex;
            height: 100vh;
            background: #0a0a0a;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-content {
            text-align: center;
            max-width: 400px;
            padding: 40px;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 25px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #d4af37;
        }

        .login-content h1 {
            font-size: 28px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .login-content p {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: #c4a032;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }

        .login-btn i {
            font-size: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: rgba(20, 20, 20, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #d4af37;
        }

        .sidebar-header .admin-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header .admin-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
        }

        .sidebar-search {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-search input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .sidebar-search input:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-search input::placeholder {
            color: #666;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-list::-webkit-scrollbar {
            width: 4px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 2px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .chat-item.active {
            background: rgba(212, 175, 55, 0.08);
            border-left-color: #d4af37;
        }

        .chat-item .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #1a1a1a;
        }

        .chat-item .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-item .chat-info .name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .chat-item .chat-info .last-msg {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item .chat-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .chat-item .chat-meta .time {
            font-size: 10px;
            color: #666;
        }

        .chat-item .chat-meta .badge {
            background: #d4af37;
            color: #000;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 700;
            display: inline-block;
            margin-top: 4px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 10, 0.9);
        }

        .chat-area .no-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
        }

        .chat-area .no-chat i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .chat-area .no-chat h3 {
            margin-bottom: 8px;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(20, 20, 20, 0.8);
        }

        .chat-header .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-header .user-info {
            flex: 1;
        }

        .chat-header .user-info .name {
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header .user-info .status {
            font-size: 12px;
            color: #2ecc71;
        }

        .chat-header .user-actions {
            display: flex;
            gap: 8px;
        }

        .chat-header .user-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #888;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-header .user-actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 2px;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .message.received {
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background: #d4af37;
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.system {
            background: rgba(255, 255, 255, 0.03);
            color: #888;
            align-self: center;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            max-width: 90%;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.6;
            display: block;
            margin-top: 4px;
        }

        .message .sender {
            font-size: 11px;
            font-weight: 600;
            color: #d4af37;
            display: block;
            margin-bottom: 2px;
        }

        .message .message-text {
            word-wrap: break-word;
        }

        .message .message-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
        }

        /* Chat Input */
        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(20, 20, 20, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-input-area .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            padding: 10px 0;
            font-size: 14px;
        }

        .chat-input-area .input-wrapper input:focus {
            outline: none;
        }

        .chat-input-area .input-wrapper input::placeholder {
            color: #666;
        }

        .chat-input-area .input-wrapper .emoji-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .chat-input-area .input-wrapper .emoji-btn:hover {
            color: #d4af37;
        }

        .chat-input-area .send-btn {
            background: #d4af37;
            border: none;
            color: #000;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .chat-input-area .send-btn:hover {
            background: #c4a032;
            transform: scale(1.05);
        }

        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Stats Bar */
        .stats-bar {
            padding: 10px 20px;
            background: rgba(20, 20, 20, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .stats-bar .stat {
            text-align: center;
        }

        .stats-bar .stat .value {
            font-size: 18px;
            font-weight: 700;
            color: #d4af37;
        }

        .stats-bar .stat .label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-4px);
            }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            align-self: flex-start;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                max-height: 100vh;
            }

            .chat-area {
                display: none;
            }

            .chat-area.active {
                display: flex;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 100;
            }

            .chat-area .back-to-list {
                display: flex !important;
            }

            .stats-bar {
                display: none;
            }
        }

        .chat-area .back-to-list {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: #000;
            font-weight: 500;
            z-index: 9999;
            animation: slideInRight 0.3s ease;
            max-width: 400px;
        }

        .notification.success {
            background: #2ecc71;
        }

        .notification.error {
            background: #e74c3c;
            color: #fff;
        }

        .notification.info {
            background: #3498db;
            color: #fff;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-content">
            <img src="/background.png" alt="Logo" class="login-logo" id="loginLogo">
            <h1>Cheerful Chick</h1>
            <p>Admin Panel - Manage your content and chat with users</p>
            <button class="login-btn" id="loginBtn">
                <i class="fab fa-telegram-plane"></i>
                Login with Telegram
            </button>
            <div style="margin-top: 20px; font-size: 12px; color: #444;">
                Only authorized admins can access this panel
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-container" style="display:none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-crown" style="color:#d4af37;"></i> Admin Panel</h2>
                <div class="admin-info">
                    <span id="adminName" style="font-size:13px;color:#888;"></span>
                    <img src="/background.png" alt="Admin" class="admin-avatar" id="adminAvatar">
                </div>
            </div>

            <div class="sidebar-search">
                <input type="text" placeholder="Search users..." id="searchUsers">
            </div>

            <div class="chat-list" id="chatList">
                <!-- Chat items will be rendered here -->
                <div style="text-align:center;padding:40px 20px;color:#444;">
                    <i class="fas fa-users" style="font-size:32px;display:block;margin-bottom:12px;"></i>
                    <p>No users yet</p>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- No Chat Selected -->
            <div class="no-chat" id="noChat">
                <i class="fas fa-comment-dots"></i>
                <h3>Select a conversation</h3>
                <p style="font-size:13px;">Choose a user from the sidebar to start chatting</p>
            </div>

            <!-- Chat Active -->
            <div id="chatActive" style="display:none;flex-direction:column;height:100%;">
                <div class="chat-header">
                    <button class="back-to-list" id="backToList"><i class="fas fa-arrow-left"></i></button>
                    <img src="/background.png" alt="User" class="user-avatar" id="chatUserAvatar">
                    <div class="user-info">
                        <div class="name" id="chatUserName">User Name</div>
                        <div class="status" id="chatUserStatus">● Online</div>
                    </div>
                    <div class="user-actions">
                        <button title="View Profile"><i class="fas fa-user"></i></button>
                        <button title="Delete Chat"><i class="fas fa-trash"></i></button>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <!-- Messages will be rendered here -->
                </div>

                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <button class="emoji-btn"><i class="far fa-smile"></i></button>
                        <input type="text" placeholder="Type a message..." id="adminMsgInput">
                        <button class="emoji-btn"><i class="fas fa-paperclip"></i></button>
                    </div>
                    <button class="send-btn" id="adminSendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Admin Panel JavaScript
        class AdminPanel {
            constructor() {
                this.currentUser = null;
                this.isAdmin = false;
                this.selectedUserId = null;
                this.users = [];
                this.messages = {};
                this.chatInterval = null;
                this.apiUrl = window.location.origin;
                this.init();
            }

            async init() {
                // Check for stored admin session
                const storedAdmin = localStorage.getItem('adminSession');
                if (storedAdmin) {
                    try {
                        const admin = JSON.parse(storedAdmin);
                        if (admin.id === this.getAdminId()) {
                            this.isAdmin = true;
                            this.currentUser = admin;
                            this.showAdminPanel();
                            this.loadUsers();
                            this.startPolling();
                            return;
                        }
                    } catch (e) {
                        console.error('Error loading admin session:', e);
                    }
                }

                // Show login screen
                document.getElementById('loginScreen').classList.remove('hidden');
                this.setupLogin();
            }

            getAdminId() {
                // Get admin ID from environment or use default
                return window.ADMIN_ID || '123456789';
            }

            setupLogin() {
                document.getElementById('loginBtn').addEventListener('click', () => {
                    this.loginWithTelegram();
                });
            }

            async loginWithTelegram() {
                try {
                    // Initialize Telegram WebApp
                    if (window.Telegram && window.Telegram.WebApp) {
                        const user = window.Telegram.WebApp.initDataUnsafe.user;
                        if (user) {
                            await this.verifyAdmin(user);
                            return;
                        }
                    }

                    // Fallback: Use Telegram Login Widget
                    this.showTelegramLoginWidget();
                } catch (error) {
                    console.error('Login error:', error);
                    this.showNotification('Login failed. Please try again.', 'error');
                }
            }

            showTelegramLoginWidget() {
                // Create a Telegram login widget
                const loginContainer = document.createElement('div');
                loginContainer.id = 'telegramLogin';
                loginContainer.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: #1a1a1a;
                    padding: 30px;
                    border-radius: 16px;
                    z-index: 10000;
                    min-width: 300px;
                    text-align: center;
                    border: 1px solid rgba(255,255,255,0.1);
                `;

                loginContainer.innerHTML = `
                    <h3 style="color:#d4af37;margin-bottom:20px;">Login with Telegram</h3>
                    <div id="telegramLoginButton"></div>
                    <button style="margin-top:15px;background:none;border:none;color:#666;cursor:pointer;font-size:13px;" id="closeLoginBtn">Cancel</button>
                `;

                document.body.appendChild(loginContainer);

                // Close button
                document.getElementById('closeLoginBtn').addEventListener('click', () => {
                    loginContainer.remove();
                });

                // Load Telegram login widget
                const script = document.createElement('script');
                script.src = 'https://telegram.org/js/telegram-widget.js?22';
                script.setAttribute('data-telegram-login', 'cheerfulchick_bot');
                script.setAttribute('data-size', 'large');
                script.setAttribute('data-onauth', 'onTelegramAuth(user)');
                script.setAttribute('data-request-access', 'write');
                document.getElementById('telegramLoginButton').appendChild(script);

                // Make the callback function global
                window.onTelegramAuth = (user) => {
                    loginContainer.remove();
                    this.verifyAdmin(user);
                };
            }

            async verifyAdmin(user) {
                try {
                    // Check if user is admin
                    const adminId = this.getAdminId();
                    
                    if (user.id.toString() === adminId) {
                        this.isAdmin = true;
                        this.currentUser = user;
                        localStorage.setItem('adminSession', JSON.stringify(user));
                        
                        document.getElementById('loginScreen').classList.add('hidden');
                        this.showAdminPanel();
                        this.loadUsers();
                        this.startPolling();
                        this.showNotification('Welcome back, Admin!', 'success');
                    } else {
                        this.showNotification('Unauthorized access. You are not an admin.', 'error');
                    }
                } catch (error) {
                    console.error('Verification error:', error);
                    this.showNotification('Error verifying admin status.', 'error');
                }
            }

            showAdminPanel() {
                document.getElementById('adminPanel').style.display = 'flex';
                const name = this.currentUser.first_name || this.currentUser.username || 'Admin';
                document.getElementById('adminName').textContent = name;
                if (this.currentUser.photo_url) {
                    document.getElementById('adminAvatar').src = this.currentUser.photo_url;
                }
            }

            async loadUsers() {
                try {
                    const response = await fetch(`${this.apiUrl}/api/users`);
                    if (response.ok) {
                        const users = await response.json();
                        this.users = users;
                        this.renderUserList(users);
                        this.updateStats(users);
                    }
                } catch (error) {
                    console.error('Error loading users:', error);
                }
            }

            renderUserList(users) {
                const list = document.getElementById('chatList');
                
                if (!users || users.length === 0) {
                    list.innerHTML = `
                        <div style="text-align:center;padding:40px 20px;color:#444;">
                            <i class="fas fa-users" style="font-size:32px;display:block;margin-bottom:12px;"></i>
                            <p>No users yet</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = users.map(user => `
                    <div class="chat-item" data-user-id="${user.id}" onclick="adminPanel.selectUser(${user.id})">
                        <img src="${user.photoUrl || '/background.png'}" alt="${user.firstName}" class="avatar">
                        <div class="chat-info">
                            <div class="name">${user.firstName || 'User'} ${user.lastName || ''}</div>
                            <div class="last-msg" id="lastMsg_${user.id}">${user.lastMessage || 'No messages yet'}</div>
                        </div>
                        <div class="chat-meta">
                            <div class="time" id="lastTime_${user.id}">${user.lastActive ? new Date(user.lastActive).toLocaleTimeString() : ''}</div>
                            ${user.unreadCount ? `<div class="badge">${user.unreadCount}</div>` : ''}
                        </div>
                    </div>
                `).join('');
            }

            updateStats(users) {
                // Update stats in the sidebar header or create stats bar
                const totalUsers = users.length;
                const onlineUsers = users.filter(u => u.online).length;
                // You can add stats display here
            }

            async selectUser(userId) {
                this.selectedUserId = userId;
                
                // Highlight selected user
                document.querySelectorAll('.chat-item').forEach(el => {
                    el.classList.remove('active');
                    if (el.dataset.userId === userId.toString()) {
                        el.classList.add('active');
                    }
                });

                // Show chat area
                document.getElementById('noChat').style.display = 'none';
                document.getElementById('chatActive').style.display = 'flex';
                
                // Get user details
                const user = this.users.find(u => u.id === userId);
                if (user) {
                    document.getElementById('chatUserName').textContent = user.firstName || 'User';
                    document.getElementById('chatUserAvatar').src = user.photoUrl || '/background.png';
                    document.getElementById('chatUserStatus').textContent = user.online ? '● Online' : '● Offline';
                }

                // Load messages
                await this.loadMessages(userId);
                
                // Mark messages as read
                this.markMessagesAsRead(userId);

                // Show back button on mobile
                if (window.innerWidth <= 768) {
                    document.getElementById('chatArea').classList.add('active');
                }
            }

            async loadMessages(userId) {
                try {
                    const response = await fetch(`${this.apiUrl}/api/chat/${userId}`);
                    if (response.ok) {
                        const messages = await response.json();
                        this.messages[userId] = messages;
                        this.renderMessages(userId, messages);
                    }
                } catch (error) {
                    console.error('Error loading messages:', error);
                }
            }

            renderMessages(userId, messages) {
                const container = document.getElementById('messagesContainer');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:40px 20px;color:#444;">
                            <i class="fas fa-comment" style="font-size:32px;display:block;margin-bottom:12px;"></i>
                            <p>No messages yet</p>
                            <p style="font-size:12px;margin-top:4px;">Start the conversation!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = messages.map(msg => {
                    const isSent = msg.userId === parseInt(this.getAdminId());
                    return `
                        <div class="message ${isSent ? 'sent' : 'received'}">
                            ${!isSent ? `<span class="sender">${msg.senderName || 'User'}</span>` : ''}
                            <div class="message-text">${msg.message}</div>
                            ${msg.image ? `<img src="${msg.image}" class="message-image">` : ''}
                            <span class="time">${new Date(msg.timestamp).toLocaleString()}</span>
                        </div>
                    `;
                }).join('');

                container.scrollTop = container.scrollHeight;
            }

            async sendMessage() {
                const input = document.getElementById('adminMsgInput');
                const message = input.value.trim();
                
                if (!message || !this.selectedUserId) return;

                try {
                    const response = await fetch(`${this.apiUrl}/api/chat/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: parseInt(this.getAdminId()),
                            recipientId: this.selectedUserId,
                            message: message,
                            type: 'text',
                            senderName: 'Admin'
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        input.value = '';
                        
                        // Update messages
                        const messages = this.messages[this.selectedUserId] || [];
                        messages.push(data.message);
                        this.messages[this.selectedUserId] = messages;
                        this.renderMessages(this.selectedUserId, messages);
                        
                        // Update last message in list
                        const lastMsgEl = document.getElementById(`lastMsg_${this.selectedUserId}`);
                        if (lastMsgEl) lastMsgEl.textContent = message;
                        
                        // Send notification via Telegram
                        this.notifyUser(this.selectedUserId, message);
                    }
                } catch (error) {
                    console.error('Error sending message:', error);
                    this.showNotification('Failed to send message', 'error');
                }
            }

            async notifyUser(userId, message) {
                try {
                    await fetch(`${this.apiUrl}/api/chat/notify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: userId,
                            message: `📩 New message from Admin: ${message}`
                        })
                    });
                } catch (error) {
                    console.error('Error sending notification:', error);
                }
            }

            async markMessagesAsRead(userId) {
                try {
                    await fetch(`${this.apiUrl}/api/chat/read/${userId}`, {
                        method: 'POST'
                    });
                } catch (error) {
                    console.error('Error marking messages as read:', error);
                }
            }

            startPolling() {
                // Poll for new messages every 5 seconds
                if (this.chatInterval) {
                    clearInterval(this.chatInterval);
                }
                
                this.chatInterval = setInterval(() => {
                    if (this.selectedUserId) {
                        this.loadMessages(this.selectedUserId);
                    }
                    this.loadUsers();
                }, 5000);
            }

            showNotification(message, type = 'info') {
                const existing = document.querySelector('.notification');
                if (existing) existing.remove();

                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }

            // Setup event listeners
            setupEventListeners() {
                // Send message on Enter
                document.getElementById('adminMsgInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });

                // Send button
                document.getElementById('adminSendBtn').addEventListener('click', () => {
                    this.sendMessage();
                });

                // Search users
                document.getElementById('searchUsers').addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase();
                    const filtered = this.users.filter(user => 
                        (user.firstName || '').toLowerCase().includes(searchTerm) ||
                        (user.username || '').toLowerCase().includes(searchTerm)
                    );
                    this.renderUserList(filtered);
                });

                // Back to list on mobile
                document.getElementById('backToList').addEventListener('click', () => {
                    document.getElementById('chatArea').classList.remove('active');
                });

                // Handle window resize
                window.addEventListener('resize', () => {
                    if (window.innerWidth > 768) {
                        document.getElementById('chatArea').classList.remove('active');
                    }
                });

                // Logout
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && document.getElementById('chatArea').classList.contains('active')) {
                        document.getElementById('chatArea').classList.remove('active');
                    }
                });
            }
        }

        // Initialize admin panel
        let adminPanel;

        // Make selectUser globally accessible
        window.onTelegramAuth = null;

        document.addEventListener('DOMContentLoaded', () => {
            adminPanel = new AdminPanel();
            adminPanel.setupEventListeners();
            
            // Make adminPanel globally accessible for inline onclick
            window.adminPanel = adminPanel;
            
            // Set admin ID from environment or localStorage
            const adminId = localStorage.getItem('adminId') || '123456789';
            window.ADMIN_ID = adminId;
        });

        // Admin ID setter (can be called from backend)
        window.setAdminId = (id) => {
            localStorage.setItem('adminId', id);
            window.ADMIN_ID = id;
        };
    </script>
</body>
  </html>
